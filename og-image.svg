<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Trainer — The right coach. Right now.">
  <title>Trainer — The right coach. Right now.</title>
  <!-- Background -->
  <rect width="1200" height="630" fill="#0B2545"/>

  <!-- Faded chevron decoration top-right -->
  <g transform="translate(820 -20)" opacity="0.13">
    <polygon fill="#FF6B35" points="0,200 160,0 240,0 80,200 240,400 160,400 0,200"/>
  </g>
  <g transform="translate(960 -40)" opacity="0.08">
    <polygon fill="#F4F1EB" points="0,220 180,0 270,0 90,220 270,440 180,440 0,220"/>
  </g>

  <!-- TRAINER wordmark + chevron lockup -->
  <g transform="translate(80 80)">
    <polygon fill="#FF6B35" points="0,52 38,0 60,0 22,52 60,104 38,104 0,52"/>
    <text x="100" y="92" font-family="Inter Tight, Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="100" letter-spacing="-3" fill="#F4F1EB">TRAINER</text>
    <rect x="100" y="110" width="120" height="6" fill="#FF6B35"/>
  </g>

  <!-- Tagline -->
  <text x="80" y="340" font-family="Inter Tight, Arial, sans-serif" font-weight="900" font-size="92" letter-spacing="-3" fill="#F4F1EB">The right coach.</text>
  <text x="80" y="440" font-family="Inter Tight, Arial, sans-serif" font-weight="900" font-size="92" letter-spacing="-3" fill="#FF6B35">Right now.</text>

  <!-- Subhead -->
  <text x="80" y="510" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-weight="500" font-size="28" fill="#C8D2E0">Utah's vetted network of youth football coaches.</text>

  <!-- Bottom badge -->
  <g transform="translate(80 545)">
    <rect width="320" height="44" rx="22" fill="none" stroke="#FF6B35" stroke-width="2"/>
    <text x="160" y="29" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="3" fill="#F4F1EB" text-anchor="middle">FOOTBALL FIRST · MADE IN UTAH</text>
  </g>
</svg>
